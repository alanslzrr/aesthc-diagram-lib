<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@aesthc/diagram-lib — seven diagram types, one visual language</title>
    <meta
      name="description"
      content="Reusable React SVG diagram library: band, flowchart, sequence, state machine, ER, timeline and swimlane layouts with a cohesive visual language."

    <meta property="og:title" content="@aesthc/diagram-lib" />
    <meta
      property="og:description"
      content="Seven diagram types, one visual language — a reusable React SVG diagram library."
    />
    <link rel="canonical" href="https://alanslzrr.github.io/aesthc-diagram-lib/" />
    <link rel="describedby" href="%BASE_URL%llms.txt" type="text/plain" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <script>
      // Set the theme before first paint: stored choice, else OS preference,
      // else the site's dark default.
      try {
        var stored = localStorage.getItem('adl-theme')
        var preferred =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = preferred
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      ><p>
        The playground needs JavaScript.
        <a href="%BASE_URL%docs/getting-started/">Read the static documentation</a> or
        <a href="%BASE_URL%agents/">the agent integration guide</a>.
      </p></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
