<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@aesthc/diagram-lib — seven diagram types, one visual language</title>
    <meta
      name="description"
      content="Reusable React SVG diagram library: band, flowchart, sequence, state machine, ER, timeline and swimlane layouts with a cohesive visual language."
    />
    <meta property="og:title" content="@aesthc/diagram-lib" />
    <meta
      property="og:description"
      content="Seven diagram types, one visual language — a reusable React SVG diagram library."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070707'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230fa8ff'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before first paint: stored choice, else OS preference,
      // else the site's dark default.
      try {
        var stored = localStorage.getItem('adl-theme')
        var preferred =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = preferred
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Geist+Mono:wght@300..600&family=Sora:wght@300..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
