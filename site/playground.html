<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground · @aesthc/diagram-lib</title>
    <meta
      name="description"
      content="Edit the JSON spec of every diagram layout and preview the rendered SVG in place."
    />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://alanslzrr.github.io/aesthc-diagram-lib/" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <script>// Shared pre-paint preference, before React hydration.
let preference = 'system'
try { const saved = localStorage.getItem('adl-theme'); if (saved === 'dark' || saved === 'light') preference = saved } catch { /* Use system when storage is blocked. */ }
document.documentElement.dataset.themePreference = preference
document.documentElement.dataset.theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference
</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      ><p>
        The playground needs JavaScript.
        <a href="%BASE_URL%docs/getting-started/">Read the static documentation</a> or
        <a href="%BASE_URL%agents/">the agent integration guide</a>.
      </p></noscript
    >
    <script type="module" src="/src/playground/main.tsx"></script>
  </body>
</html>
