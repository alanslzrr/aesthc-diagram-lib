name: Release package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Require a version tag on main
        run: |
          # JavaScript template literals must not be expanded by the shell.
          # shellcheck disable=SC2016
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(process.env.GITHUB_REF !== `refs/tags/v${p.version}`) throw Error("Dispatch this workflow on the exact version tag")'
          git merge-base --is-ancestor HEAD origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm release:check
      - run: pnpm test:visual
      - run: pnpm test:frameworks
      - run: pnpm audit --audit-level=high
      - name: Verify generated distribution
        run: |
          git diff --exit-code -- dist/
          test -z "$(git ls-files --others --exclude-standard -- dist/)"
      - run: npm pack --ignore-scripts --pack-destination /tmp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-package
          path: /tmp/aesthc-diagram-lib-*.tgz
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-package
          path: package
      - name: Detect an already published identical artifact
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          const version = process.env.GITHUB_REF_NAME.slice(1)
          const response = await fetch(`https://registry.npmjs.org/@aesthc%2fdiagram-lib/${version}`)
          if (response.status === 404) process.exit(0)
          if (!response.ok) throw Error(`Registry check failed: ${response.status}`)
          const published = await response.json()
          const archive = fs.readdirSync('package').find(file => file.endsWith('.tgz'))
          const integrity = 'sha512-' + crypto.createHash('sha512').update(fs.readFileSync(`package/${archive}`)).digest('base64')
          if (published.dist.integrity !== integrity) throw Error('Version already exists with a different artifact; never overwrite it')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=true\n')
          NODE
      - name: Publish the verified artifact with OIDC
        if: steps.registry.outputs.exists != 'true'
        run: npm publish ./package/*.tgz --ignore-scripts --access public --provenance
  verify-public:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-package
          path: verified-package
      - name: Compare and install the anonymous registry artifact
        run: node scripts/verify-public-release.mjs verified-package/*.tgz
