name: Deploy site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Require the current validated main revision
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$VERIFIED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package and build documentation site
        run: pnpm check
        env:
          DOCS_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          SITE_BASE: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a superseded revision before promotion
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: test "$(git ls-remote "https://github.com/$REPOSITORY.git" refs/heads/main | cut -f1)" = "$VERIFIED_SHA"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed revision and public documentation
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Checking deployed revision (attempt $attempt/6)"
            if curl --fail --silent --show-error "${PAGE_URL}deployment.json" | jq -e --arg sha "$VERIFIED_SHA" '.sha == $sha'; then
              curl --fail --silent --show-error "${PAGE_URL}docs/getting-started/" | grep -q 'First diagram'
              curl --fail --silent --show-error "${PAGE_URL}agents/index.md" | grep -q '@aesthc/diagram-lib'
              exit 0
            fi
            sleep 10
          done
          exit 1
