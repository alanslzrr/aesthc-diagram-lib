name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    needs: minimum-consumer
    if: always()
    name: Contracts and package
    runs-on: ubuntu-24.04
    steps:
      - name: Require a successful minimum consumer
        if: needs.minimum-consumer.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=high
      - name: Verify tracked distribution
        run: |
          git diff --exit-code -- dist/
          test -z "$(git ls-files --others --exclude-standard -- dist/)"
      - name: Test React 18 consumer
        run: node scripts/test-package.mjs
        env:
          REACT_VERSION: 18.3.1
          REACT_TYPES_VERSION: 18.3.28
          REACT_DOM_TYPES_VERSION: 18.3.7
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Compare reviewed Chromium visuals
        run: pnpm test:visual
      - run: pnpm test:e2e
      - run: node scripts/test-frameworks.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  minimum-consumer:
    name: Node 20.19 / React 18.3.1 consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.19.0'
      - run: node scripts/test-package.mjs
        env:
          REACT_VERSION: 18.3.1
          REACT_TYPES_VERSION: 18.3.28
          REACT_DOM_TYPES_VERSION: 18.3.7
